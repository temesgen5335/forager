# Free, zero-infra daily job digest on GitHub Actions — the dependability baseline.
#
# Runs the API-source pipeline (RemoteOK, Remotive, Greenhouse, Lever, Ashby) +
# matching, then pushes the digest to Telegram via the Bot API.
#
# Does NOT do Telegram CHANNEL scraping (Telethon needs a stable IP + persistent
# session — not viable on ephemeral CI runners) and does NOT host the interactive
# bot. For those, use a VPS (docs/DEPLOYMENT.md) or launchd on a Mac.
#
# REQUIRED — repo → Settings → Secrets and variables → Actions → Secrets:
#   GROQ_API_KEY          (or GEMINI_API_KEY / OPENROUTER_API_KEY — at least one)
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
# RECOMMENDED — same Secrets page:
#   JOBAGENT_PROFILE_JSON your data/profile.json as one JSON string (target_roles,
#                         core_skills, skill_weights, remote_scope, geo_* …) so CI
#                         matches YOUR search, not the committed placeholder profile.
#                         It is PII — keep it a secret, never commit it (R22).
# OPTIONAL — same page, Variables tab (NOT secrets; these are not sensitive):
#   LLM_PROVIDER          default groq
#   INGEST_MAX_AGE_DAYS   default 45 below — also what keeps the cached store small
#   INGEST_LOCATIONS      e.g. "remote,EMEA,Africa"
#   INGEST_DROP_KEYWORDS  e.g. "unpaid,clearance required"
#   INGEST_SOURCES        e.g. "remoteok,remotive,greenhouse,lever,ashby"
#
# The ingest gate is configured here rather than read from the encrypted secret
# store: that store lives in `data/` on your own machine and is not present in CI.
#
# Scheduled workflows only run on the default branch, cron is UTC, and GitHub
# disables them after 60 days of repo inactivity (any commit re-enables).

name: Job digest

on:
  schedule:
    - cron: "0 4 * * *"      # 04:00 UTC = 07:00 EAT
  workflow_dispatch: {}        # lets you trigger it manually from the Actions tab

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Persist the SQLite store between runs so "new since last run" works.
      # Unique key always saves; restore-keys pulls the most recent prior cache.
      # Size matters here: GitHub caps a repo at 10 GB and evicts LRU, so an
      # unbounded store would eventually evict the very cache it needs. The ingest
      # gate below plus the prune step keep it small.
      - name: Restore job store
        uses: actions/cache@v4
        with:
          path: data
          key: jobagent-db-${{ github.run_id }}
          restore-keys: jobagent-db-

      # Your profile is a secret, never in the repo (R22). Write it to an ephemeral path
      # OUTSIDE the cached data/ dir so the PII is not persisted in the Actions cache,
      # and point the loader at it below via JOBAGENT_PROFILE_PATH. Skipped (falls back
      # to the committed placeholder profile) when the secret is unset.
      - name: Materialize profile from secret
        if: ${{ secrets.JOBAGENT_PROFILE_JSON != '' }}
        env:
          PROFILE_JSON: ${{ secrets.JOBAGENT_PROFILE_JSON }}
        run: printf '%s' "$PROFILE_JSON" > "$RUNNER_TEMP/profile.json"

      - name: Install
        run: pip install -e ".[llm]"

      - name: Ingest + match + send digest
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Your profile overlay (written above from the secret, or absent → placeholder).
          JOBAGENT_PROFILE_PATH: ${{ runner.temp }}/profile.json
          # Ingest gate — also the primary control on cached-store growth.
          INGEST_MAX_AGE_DAYS: ${{ vars.INGEST_MAX_AGE_DAYS || '45' }}
          INGEST_LOCATIONS: ${{ vars.INGEST_LOCATIONS }}
          INGEST_DROP_KEYWORDS: ${{ vars.INGEST_DROP_KEYWORDS }}
          INGEST_SOURCES: ${{ vars.INGEST_SOURCES }}
        run: python scripts/pipeline.py --top 10

      # Backstop for the cache limit: the gate bounds what enters, this bounds what
      # accumulates. Jobs you applied to are never pruned, whatever their age.
      - name: Prune stale postings
        env:
          INGEST_MAX_AGE_DAYS: ${{ vars.INGEST_MAX_AGE_DAYS || '45' }}
        run: python scripts/prune_store.py --older-than 90 --apply --vacuum

      - name: Report store size
        run: du -h data/jobagent.db || true

      # A pipeline that fails silently is the problem this whole workflow exists to
      # solve, so a failed run has to reach the same place a successful one does.
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=⚠️ Job digest FAILED on GitHub Actions.
          No digest today. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              > /dev/null
          fi
